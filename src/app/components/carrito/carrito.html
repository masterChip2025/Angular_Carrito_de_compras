<div class="min-h-dvh bg-slate-950 p-2 sm:p-4 text-white flex flex-col justify-start items-center">
  <div class="w-full max-w-5xl">
    <h2
      class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300 mb-6 tracking-tight flex items-center gap-2"
    >
      <svg
        xmlns="http://w3.org"
        class="h-8 w-8 text-purple-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
        />
      </svg>
      Carrito de Compras
    </h2>

    <div
      class="w-full overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/50 backdrop-blur-sm shadow-2xl"
    >
      <table class="w-full border-collapse text-left text-sm text-slate-300">
        <thead
          class="bg-slate-800/70 text-xs font-semibold uppercase tracking-wider text-purple-300 border-b border-slate-800"
        >
          <tr>
            <th scope="col" class="w-[35%] px-2 py-2">Productos</th>
            <th scope="col" class="w-[20%] px-2 py-4 text-center">Precio</th>
            <th scope="col" class="w-[10%] px-2 py-4 text-center">C/D</th>
            <th scope="col" class="w-[20%] px-2 py-4 text-left">Total</th>
            <th scope="col" class="w-[15%] px-2 py-4 text-left">Eliminar</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-800/60">
          @for (item of items; track $index) {
            <tr class="transition-colors duration-200 hover:bg-slate-800/40 group">
              <td class="px-2 py-4 font-medium text-white max-w-xs">
                <div class="flex flex-col">
                  <span
                    class="text-xs font-semibold group-hover:text-purple-300 transition-colors truncate"
                  >
                    {{ item.product.name }}
                  </span>
                  <span class="text-xs text-slate-400 font-normal line-clamp-1 mt-0.5">
                    Ref: #{{ $index + 1 }}
                  </span>
                </div>
              </td>

              <td class="px-2 py-4 text-center font-mono text-slate-400">
                {{ item.product.price | currency }}
              </td>

              <td class="px-2 py-4 text-left">
                <span
                  class="inline-flex items-center justify-center px-2 py-1 text-xs font-bold bg-slate-800 text-purple-200 rounded-full border border-slate-700"
                >
                  {{ item.quantity }}
                </span>
              </td>

              <td
                class="px-2 py-4 text-left font-mono font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300 text-xs"
              >
                {{ item.product.price * item.quantity | currency }}
              </td>
              <td
                class="px-2 py-4 text-left font-mono font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300 text-sm"
              >
                <button
                  class="bg-red-600 hover:bg-red-700 text-white font-sm py-2 px-2 rounded-lg transition duration-200 project-shadow"
                  (click)="onDeleteProduct(item.product.id)"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    xmlns="http://w3.org"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"
                    ></path>
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
        <tfoot class="bg-slate-800/40 border-t border-slate-800 font-semibold text-white">
          <tr>
            <td colspan="3" class="px-2 py-5 text-left text-base text-slate-400 font-normal">
              Total del carrito:
            </td>
            <td
              colspan="2"
              class="px-3 py-5 text-left font-mono text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300"
            >
              {{ total | currency }}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>

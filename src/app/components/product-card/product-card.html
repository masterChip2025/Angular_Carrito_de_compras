<div
  class="p-6 w-full bg-gradient-to-r from-pink-400 to-indigo-500 rounded-2xl shadow-2xl flex flex-col justify-between items-center text-center mb-2"
>
  <div class="w-full min-w-0">
    <h5
      class="block w-full text-base md:text-base lg:text-base font-semibold text-purple-800 truncate"
    >
      {{ product.name }}
    </h5>
    <p class="text-purple-800 text-sm font-medium">
      {{ product.description }}
    </p>
    <p
      class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300 mt-2 text-base"
    >
      {{ product.price | currency }}
    </p>
  </div>

  <div class="flex items-center">
    <button
      class="flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-white bg-purple-600 rounded-lg transition-colors duration-200 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-slate-900 shrink-0"
      (click)="addCart(product)"
    >
      <svg
        xmlns="http://w3.org"
        class="h-3.5 w-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      Añadir
    </button>
  </div>
</div>
